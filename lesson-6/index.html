<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lesson-6</title>
</head>

<body>
    <ul>
        <li>Первый</li>
        <li>Второй</li>
        <li>Третий</li>
        <li>Четвертый</li>
        <li>Пятый</li>
        <li>Шестой</li>
    </ul>

    <!-- ul - это тег ненумерованного списка, внутри него есть теги li то есть лист айтем, в которых мы указываем содержимое нашего списка -->

    <ol>
        <li>Первый</li>
        <li>Второй</li>
        <li>Третий</li>
        <li>Четвертый</li>
        <li>Пятый</li>
        <li>Шестой</li>
    </ol>

    <!-- ol - это тег нумерованного списка, внутри него есть теги li то есть лист айтем, в которых мы указываем содержимое нашего списка -->

    <dl>
        <dt>Рецепт</dt>
        <dd>Сахар</dd>
        <dd>Молоко</dd>
        <dd>Пшеница</dd>
    </dl>

    <!-- dl - это тег списка для описания чего либо, внутри него есть тег dt который указывает название списка и что мы будем описывать, а dd это тег в который мы уже указываем содержимое для описания списка -->

    <!-- Так-же в HTML можно вкладывать списки внутри списков, например для того, что-бы сделать подкатегории, например продукты> молоко, хлеб, печенье > канцелярские товары, ручки, карандаши, ластик -->

    <ul>
        <li>Продукты</li>
        <li>Хлеб</li>
        <li>Печенье</li>
        <li>Молоко</li>
        <li>Шаурма</li>
        <ol>
            <li>Канцелярия</li>
        </ol>
    </ul>

    <ul>
        <li>Фрукты
            <ul>
                <li>Яблоко</li>
                <li>Яблоко</li>
                <li>Яблоко</li>
            </ul>
        </li>
    </ul>

    <!--Так-же у списков существует атрибут reversed, для того, что-бы сделать список в обратном порядке -->
</body>

</html>
