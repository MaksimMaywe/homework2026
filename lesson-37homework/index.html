<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>lesson-37homework</title>
</head>

<body>
    <form class="form">
        <fieldset>
            <label for="" class="label-first">Ваши личные данные</label>
            <br>
            <label class="label">
                Ваше имя
                <input type="text" name="name" id="name" value="Ваше имя" required>
            </label>
            <br>
            <label class="label">
                Возраст
                <input type="name" name="age" id="age" value="Ваш возраст" required>
            </label>
            <br>
            <label class="label">
                Номер телефона
                <input type="tel" name="tel" id="tel" value="Ваш номер телефона" required>
            </label>
            <br>
            <label class="label">
                Ваша почта
                <input type="email" name="email" id="email" value="Почта" required>
            </label>
            <br>
            <label class="label">
                Сообщение
                <textarea name="" id="" cols="35px" rows="5px" required placeholder="Ваше сообщение"></textarea>
            </label>
            <br>
            <label>
                <input type="checkbox">
                Я принимаю условия
            </label>
            <br>
            <button type="submit">Отправить</button>
        </fieldset>
    </form>
</body>

</html>
