<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обучение HTML</title>
</head>

<!-- Все то, что в документе написано выше - является базовой разметкой HTML документа -->
<!-- !DOCTYPE - это тег который говорит браузеру какой язык мы используем -->
<!-- html - это по сути главный тег в документе, он начинается почти в самом начале и заканчивается в самом конце, в нём например можно указать атрибут lang со значение например ru, что будет говорить о том, что наш сайт на русском языке -->
<!-- head - это тег в который помещаются теги, которые обычно отвечают за серверную информацию, которую на сайте визуально не видит наш конечный пользователь сайта, например мета-теги -->
<!-- meta - это мета теги, например атрибут charset со значение utf-8 говорит о том, какая кодировка у нас будет использоваться на нашем сайте, для корректного отображения элементов, meta с атрибутом name служит для того, что-бы сделать аш сайт адаптивным на всех устройствах, например на мобильных, так-же можно указать например keywords для того, что-бы указать ключевые слова, по которым наш сайт будет находиться в поисковом запросе - это нужно для SEO - оптимизации -->
<!-- title - это тег с помощью которого мы можем задать заголовок нашего сайта во вкладке браузера -->
<!-- body - это главный тег в котором пишется вся основная информация, которую как раз таки увидит конечный пользователь нашего сайта, например h1, p, br и тому подобные теги которые визуально будет видно и они отвечают за визуальное наполнение нашего сайта -->

<body>
    <h1>Привет, Мир</h1>
    <p>Привет, Мир</p>
    <h3>Привет, Мир</h3>
</body>

</html>
