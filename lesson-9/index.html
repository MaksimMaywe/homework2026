<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lesson-9</title>
</head>

<body>
    <h1>Видео об авторе</h1>
    <video controls muted autoplay loop poster="./image/mee.jpg" width="350px" height="400px">
        <source src="./video/me.mp4" type="video/mp4">
        <source src="./video/me.mp4" type="video/webp">
        Упс, видео не доступно ///
    </video>

    <!-- Конструкция с source нужна для того, что-бы браузеру было проще определить какой формат будет у видео, в случае если первый формат видео не работает, в таком случае браузер будет пробовать подгрузить второй формат, который мы указали строкой ниже, а если ни какой из форматов не будет поддерживаться, тогда выведиться текст, который мы написали, в данном случае "Упс, видео не доступно ///" так-же существует атрибут poster с помощью которого мы можем установить превью для нашего видео -->

    <!-- video - это тег с помощью которого мы можем добавить видео на наш сайт, у тега video существуют специальные атрибуты, например controls, что-бы появились элементы управления, muted для того, что-бы видео сразу-же было без звука, autoplay, нужен для того, что бы видео автоматически запускалось при заходе пользователя на наш сайт. Обычно используется структура muted autoplay что-бы при заходе на наш сайт видео сразу-же воспроизводилось, но без звука, так как никому не будет нравится если при заходе на сайт будет играть громкий звук, loop позволяет сделать видео зацикленным, то есть бесконечным, так-же для видео мы можем указывать ширину и высоту -->

    <audio src="" muted autoplay loop controls></audio>

    <!-- audio - это тег с помощью которого мы можем добавить аудиофайл на наш сайт, атрибуты которые используюбтся для audio схожи с теми, которые используются для видео -->

</body>

</html>
